<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, viewport-fit=cover">

<title>探索区块链 - 交易所官方注册地址</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

html {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

html::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #5c6267;
    color: #111;
    overflow: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

body::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

.page {
    position: relative;
    min-height: 100svh;
    min-height: 100dvh;
    overflow: hidden;
}

/* 真正的动态背景 GIF */
.background-gif {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    z-index: 0;
    pointer-events: none;
}

/* 半透明遮罩，保证文字在各种手机上都清楚 */
.background-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(
        to bottom,
        rgba(255,255,255,.04) 0%,
        rgba(255,255,255,0) 36%,
        rgba(70,76,81,.08) 100%
    );
}

.content {
    position: relative;
    z-index: 2;

    width: min(100%, 580px);

    min-height: 100svh;
    min-height: 100dvh;

    margin: 0 auto;

    /* 使用动态单位，自动适应不同宽高的手机 */
    padding:
        clamp(62px, 8.8vh, 105px)
        clamp(24px, 6.1vw, 42px)
        max(42px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Logo */
.roc-logo {
    width: clamp(70px, 17vw, 88px);
    aspect-ratio: 1;
    border-radius: 50%;
    margin-bottom: clamp(20px, 2.5vh, 28px);
    overflow: hidden;
    position: relative;
    background: linear-gradient(90deg,#fff 50%,#ffc400 50%);
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.roc-logo img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
}

.roc-logo .grid {
    position: absolute;
    left: 0;
    top: 0;
    width: 50%;
    height: 100%;
    background:
        linear-gradient(#111 0 50%, transparent 50%),
        linear-gradient(90deg,#111 0 50%,#fff 50%);
    background-size: 100% 100%, 100% 50%;
    background-position: 0 0, 0 0;
}

.roc-logo .diamond {
    position: absolute;
    width: 43%;
    height: 43%;
    left: 48%;
    top: 28%;
    transform: rotate(45deg);
    border: clamp(8px, 2vw, 11px) solid #111;
    background: #ffc400;
}

/* 标题 */
.title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.3vw, 8px);
    margin-bottom: clamp(8px, 1.2vh, 12px);
}

.title {
    font-size: clamp(25px, 6.8vw, 34px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -1px;
    color: #050505;
}

.verified {
    width: clamp(18px, 5vw, 23px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #15a9e8;
    position: relative;
    flex: 0 0 auto;
}

.verified::after {
    content: "✓";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-53%);
    color: white;
    font-size: clamp(11px, 3vw, 15px);
    font-weight: 900;
}

/* 副标题 */
.subtitle {
    font-size: clamp(18px, 5vw, 25px);
    line-height: 1.2;
    font-weight: 500;
    color: #111;
    text-align: center;
    margin-bottom: clamp(28px, 3.8vh, 42px);
}

/* 列表 */
.nav-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(15px, 2.25vh, 23px);
}

/* 卡片 */
.nav-item {
    width: 100%;
    height: clamp(82px, 6.7vw + 35px, 104px);
    min-height: 82px;
    padding: clamp(10px, 1.8vw, 15px);

    display: flex;
    align-items: center;

    background: rgba(255,255,255,.98);
    border-radius: clamp(12px, 2.1vw, 15px);

    text-decoration: none;
    color: #111;

    box-shadow: 0 2px 9px rgba(0,0,0,.075);

    transition: transform .15s ease, box-shadow .15s ease;
}

.nav-item:active {
    transform: scale(.985);
}

/* 交易所 Logo */
.exchange-logo {
    width: clamp(54px, 13vw, 74px);
    aspect-ratio: 1;
    flex: 0 0 auto;

    border-radius: clamp(8px, 1.8vw, 11px);

    margin-right: clamp(17px, 4.5vw, 27px);

    display: flex;
    align-items: center;
    justify-content: center;
}

/* OKX */
.okx-logo {
    background: #000;
}



/* Binance */
.binance-logo {
    background: transparent;
}



/* 文字 */
.nav-text {
    flex: 1;
    min-width: 0;
    font-size: clamp(19px, 4.7vw, 25px);
    font-weight: 500;
    white-space: nowrap;
}

/* 三个点 */
.more {
    flex: 0 0 auto;
    width: clamp(22px, 5.8vw, 30px);
    text-align: center;
    font-size: clamp(24px, 6vw, 29px);
    line-height: 1;
    font-weight: 700;
    margin-left: 7px;
}

/* 超矮屏幕：防止内容挤压 */
@media (max-height: 650px) {
    .content {
        padding-top: 34px;
    }

    .roc-logo {
        width: 62px;
        margin-bottom: 14px;
    }

    .subtitle {
        margin-bottom: 24px;
    }

    .nav-item {
        height: 76px;
        min-height: 76px;
    }
}

/* 超宽屏幕：避免平板上卡片无限变宽 */
@media (min-width: 700px) {
    .content {
        padding-top: 90px;
    }
}

/* 原图 691×1536 比例的视觉优化 */
@media (min-aspect-ratio: 9/20) and (max-aspect-ratio: 10/20) {
    .content {
        padding-top: 7.8vh;
    }

    .nav-list {
        gap: 18px;
    }

    .nav-item {
        height: 100px;
    }
}

/* 防止超窄设备上的卡片过宽 */
@media (max-width: 380px) {
    .content {
        width: 100%;
        padding-left: 22px;
        padding-right: 22px;
    }

    .nav-item {
        height: 88px;
    }

    .exchange-logo {
        width: 58px;
        margin-right: 17px;
    }

    .nav-text {
        font-size: 20px;
    }
}


.brand-svg {
    width: 100%;
    height: 100%;
    display: block;
}

.binance-svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* Canvas 动态背景：用 GPU/浏览器实时绘制波浪，替代 GIF */
.background-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    pointer-events: none;
}

</style>

<style id="logo-fix">
.exchange-icon{
  width: clamp(38px, 10vw, 54px) !important;
  height: clamp(38px, 10vw, 54px) !important;
  object-fit: cover !important;
  display:block;
  flex:0 0 auto;
}
</style>


<style id="logo-size-fix">
.exchange-icon{
  width: clamp(52px, 14vw, 68px) !important;
  height: clamp(52px, 14vw, 68px) !important;
  object-fit: cover !important;
  flex: 0 0 auto;
}
</style>

</head>

<script>
(() => {
    const canvas = document.getElementById('backgroundCanvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d', { alpha: false });
    let width = 0, height = 0, dpr = 1;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function wavePath(baseY, amplitude, length, phase, power) {
        // 波浪左右各向屏幕外延伸，避免动画移动到边缘时出现空隙
        const bleed = Math.max(120, width * 0.12);
        const startX = -bleed;
        const endX = width + bleed;

        ctx.beginPath();
        ctx.moveTo(startX, height);
        for (let x = startX; x <= endX; x += 6) {
            const p = x / width;
            const y = baseY
                + Math.sin(p * Math.PI * 2 * length + phase) * amplitude
                + Math.sin(p * Math.PI * 4 * length + phase * 0.63) * amplitude * 0.18;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endX, height);
        ctx.closePath();
        ctx.fill();
    }

    let start = performance.now();

    function draw(now) {
        const t = (now - start) / 1000;

        // 与原背景相近的浅灰→深灰纵向渐变
        const bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#f3f6f6');
        bg.addColorStop(0.58, '#dce0e0');
        bg.addColorStop(0.78, '#aeb3b6');
        bg.addColorStop(1, '#525252');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        // 多层缓慢流动的波浪，使用不同速度避免机械重复
        const base = height * 0.73;

        ctx.fillStyle = '#8b9195';
        wavePath(
            base,
            Math.max(12, height * 0.035),
            1.7,
            t * 0.75,
            1
        );

        ctx.fillStyle = '#5c6267';
        wavePath(
            base + height * 0.015,
            Math.max(18, height * 0.048),
            1.25,
            -t * 0.55 + 1.2,
            1
        );

        ctx.fillStyle = '#565b5f';
        wavePath(
            base + height * 0.085,
            Math.max(15, height * 0.038),
            1.55,
            t * 0.38 + 2.4,
            1
        );

        requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize, { passive: true });
    requestAnimationFrame(draw);
})();
</script>
